<style>
/* Layout: início com cartões de produto; ao tocar, a página do produto (galeria | compra, envio, rastreio, detalhes). Marca: preto e amarelo da logo The Egg */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --fg:#151515; --muted:#5F5F58; --line:#E1E1DA;
  --accent:#151515; --accent-soft:#FFF3BF; --brand:#FFD000; --brand-fg:#151515;
  --sale:#B2361F; --sale-soft:#FBE6E0; --good:#1E7A46; --stage:#EBEBE6;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0E; --surface:#1A1A18; --fg:#F3F2EC; --muted:#A5A399; --line:#2E2E2A;
    --accent:#FFD000; --accent-soft:#2D2810; --brand:#FFD000; --brand-fg:#151515;
    --sale:#FF8D78; --sale-soft:#3A201A; --good:#5FD08A; --stage:#242420; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#1A1A18; --fg:#F3F2EC; --muted:#A5A399; --line:#2E2E2A;
  --accent:#FFD000; --accent-soft:#2D2810; --brand:#FFD000; --brand-fg:#151515;
  --sale:#FF8D78; --sale-soft:#3A201A; --good:#5FD08A; --stage:#242420; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.55;
  padding-block:0 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1080px; margin:0 auto}
h1,h2{font-family:var(--f-display); text-wrap:balance; margin:0; line-height:1.15}
h2{font-size:1.45rem; letter-spacing:-0.01em}
a{color:inherit}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.label{font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.brandlink{display:block; line-height:0}
.brandlink img{width:60px; height:60px; border-radius:12px; display:block}
.crumbs{font-size:.82rem; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs b{font-weight:500; color:var(--fg)}

/* início */
.intro{padding-block:28px 6px}
.intro h1{font-size:clamp(1.8rem,4vw,2.6rem); letter-spacing:-0.025em}
.intro p{margin:8px 0 0; color:var(--muted); max-width:60ch}
.perks{display:flex; gap:8px 10px; flex-wrap:wrap; margin-top:16px}
.perks span{background:var(--accent-soft); border-radius:999px; padding:5px 12px; font-size:.84rem}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:16px; margin-top:22px}
.card{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; text-decoration:none; min-width:0}
.card:hover{border-color:var(--accent)}
.cover{position:relative; aspect-ratio:4/3; background:var(--stage); overflow:hidden}
.cover img{width:100%; height:100%; object-fit:cover; display:block}
.tag{position:absolute; top:10px; left:10px; background:var(--brand); color:var(--brand-fg); font-weight:700; font-size:.78rem; padding:3px 9px; border-radius:6px}
.cbody{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
.ctitle{font-family:var(--f-display); font-size:1.08rem; line-height:1.25; font-weight:700}
.cmeta{font-size:.82rem; color:var(--muted)}
.cprice{margin-top:auto; padding-top:4px; font-family:var(--f-display); font-weight:700; font-size:1.4rem; letter-spacing:-0.01em}
.cprice small{font-family:var(--f-body); font-weight:400; font-size:.78rem; color:var(--muted); margin-right:6px}
.cship{font-size:.82rem; color:var(--good); font-weight:500}

/* produto */
.back{display:inline-block; margin-top:18px; font-size:.9rem; font-weight:600; color:var(--accent); text-decoration:none}
.back:hover{text-decoration:underline}
.layout{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:32px; padding-block:18px 28px}
.stage{background:var(--stage); border-radius:14px; aspect-ratio:1/1; max-width:100%; position:relative; overflow:hidden}
.stage img{width:100%; height:100%; object-fit:cover; display:block}
.stage .cap{position:absolute; left:12px; right:12px; bottom:12px; background:rgba(15,15,12,.74); color:#fff; font-size:.85rem; padding:8px 12px; border-radius:8px}
.thumbs{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
.thumb{width:76px; height:76px; border-radius:10px; border:2px solid var(--line); background:var(--stage); cursor:pointer; padding:0; overflow:hidden}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thumb[aria-pressed="true"]{border-color:var(--accent)}

.buy h1{font-size:clamp(1.6rem,3.2vw,2.2rem); letter-spacing:-0.02em}
.meta{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:.88rem; color:var(--muted)}
.meta strong{color:var(--fg)}
.price{display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 12px; margin-top:18px; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.price .now{font-family:var(--f-display); font-weight:700; font-size:2.1rem; letter-spacing:-0.02em}
.price .old{color:var(--muted); text-decoration:line-through}
.price .off{background:var(--sale-soft); color:var(--sale); font-weight:600; font-size:.8rem; padding:2px 8px; border-radius:5px}
.price .inst{flex-basis:100%; color:var(--muted); font-size:.9rem}
.field{margin-top:18px}
.field .label{display:block; margin-bottom:8px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{border:1.5px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 14px; cursor:pointer; text-align:left; line-height:1.25}
.chip small{display:block; color:var(--muted); font-size:.78rem}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.qty{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.step{display:inline-flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.step button{width:40px; height:40px; border:0; background:transparent; cursor:pointer; font-size:1.2rem}
.step button:disabled{opacity:.35; cursor:default}
.step output{min-width:44px; display:grid; place-items:center; font-weight:600; border-inline:1px solid var(--line)}
.stock{font-size:.85rem; color:var(--muted)}
.hint{margin-top:14px; padding:10px 14px; border-radius:10px; background:var(--accent-soft); font-size:.9rem}
.cta{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
.btn{flex:1 1 180px; min-height:48px; border-radius:10px; border:1.5px solid var(--accent); font-weight:600; cursor:pointer; padding:0 18px}
.btn.ghost{background:var(--surface); color:var(--fg)}
.btn.solid{background:var(--brand); color:var(--brand-fg); border-color:var(--brand)}
.status{min-height:1.4em; margin-top:10px; font-size:.88rem; color:var(--good)}

section.block{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; margin-top:18px}
.sec-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.sec-head p{margin:0; color:var(--muted); font-size:.9rem}
.ship-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:24px}
.origin{display:grid; align-content:start}
.origin div{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line)}
.origin div span:first-child{color:var(--muted)}
.origin div span:last-child{text-align:right; font-weight:500}
.shipnote{margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--accent-soft); font-size:.9rem}
.cep{display:flex; gap:8px; flex-wrap:wrap}
.cep input{flex:1 1 140px; min-width:0; height:46px; border:1.5px solid var(--line); border-radius:8px; padding:0 12px; background:var(--bg); font-family:var(--f-mono)}
.cep button{height:46px; padding:0 18px; border-radius:8px; border:0; background:var(--brand); color:var(--brand-fg); font-weight:600; cursor:pointer}
.err{color:var(--sale); font-size:.88rem; min-height:1.3em; margin-top:6px}
.opts{display:grid; gap:10px; margin-top:6px}
.opt{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; background:var(--bg)}
.opt:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.opt input{accent-color:var(--accent); width:18px; height:18px; margin:0}
.opt b{display:block}
.opt small{color:var(--muted); display:block}
.opt .p{font-weight:600; white-space:nowrap}
.opt .p.free{color:var(--good)}
.nope{padding:14px; border-radius:10px; background:var(--sale-soft); font-size:.92rem}

.track{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(6,minmax(0,1fr))}
.track li{position:relative; padding:34px 6px 0; text-align:center; font-size:.85rem}
.track li::before{content:""; position:absolute; top:10px; left:0; right:0; height:3px; background:var(--line)}
.track li:first-child::before{left:50%}
.track li:last-child::before{right:50%}
.track li::after{content:""; position:absolute; top:3px; left:calc(50% - 8px); width:16px; height:16px; border-radius:50%; background:var(--surface); border:3px solid var(--line)}
.track li.done::before{background:var(--accent)}
.track li.done::after{background:var(--brand); border-color:var(--accent)}
.track li b{display:block; font-weight:600}
.track li span{display:block; color:var(--muted); font-size:.78rem; margin-top:2px}
.code{display:inline-flex; gap:10px; align-items:center; background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:6px 12px; font-size:.85rem; margin-bottom:6px; flex-wrap:wrap}
.note{color:var(--muted); font-size:.85rem; margin:14px 0 0}

.cols{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px}
.desc p{margin:0 0 12px; max-width:65ch}
.desc ul{margin:0; padding-left:18px; display:grid; gap:6px}
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:.92rem}
th,td{text-align:left; padding:9px 0; border-bottom:1px solid var(--line); vertical-align:top}
th{font-weight:500; color:var(--muted); width:46%; padding-right:12px}
.policies{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:18px}
.pol{border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--surface)}
.pol b{display:block; font-family:var(--f-display); font-size:1.02rem; margin-bottom:4px}
.pol p{margin:0; color:var(--muted); font-size:.9rem}
footer{margin-top:22px; color:var(--muted); font-size:.82rem}

@media (max-width:860px){
  .layout,.ship-grid,.cols{grid-template-columns:minmax(0,1fr)}
  .policies{grid-template-columns:minmax(0,1fr)}
  .track{grid-template-columns:minmax(0,1fr)}
  .track li{text-align:left; padding:0 0 18px 34px}
  .track li::before{top:0; bottom:0; left:7px; right:auto; width:3px; height:auto}
  .track li:first-child::before{top:12px; left:7px}
  .track li:last-child::before{bottom:calc(100% - 12px); right:auto}
  .track li::after{top:0; left:0}
  section.block{padding:18px}
}
@media (prefers-reduced-motion:no-preference){
  .opt,.chip,.thumb,.card{transition:border-color .15s, background .15s}
}
</style>

        '<div class="cbody"><div class="ctitle">'+p.title+'</div>'+
        '<div class="cmeta">★ '+p.rating+' · '+p.sold+' vendidos</div>'+
        '<div class="cprice"><small>a partir de</small>'+brl(min)+'</div>'+
        '<div class="cship">'+p.shipHint+'</div></div></a>';
    }).join('');
    app.innerHTML =
      '<section class="intro"><h1>Escolha o seu ovo</h1>'+
      '<p>Toque em um produto para ver o preço, o frete para o seu CEP e a previsão de entrega.</p>'+
      '<div class="perks"><span>Frete grátis a partir de R$ 79,00</span><span>Ovo quebrado a gente troca</span><span>Compra protegida</span></div></section>'+
      '<div class="cards">'+cards+'</div>';
  }

  // ---------- produto
  function renderProduct(p){
    crumbs.innerHTML = '<a href="#inicio">Início</a>›<b>'+p.short+'</b>';
    var cur = 0, qty = 1, photo = 0, chosen = 0, options = [], served = true;
    var post = nextPost(p.postDays);

    var shipRows =
      '<div><span>Enviado de</span><span>'+p.origin+'</span></div>'+
      '<div><span>Dias de postagem</span><span>'+p.postLabel+'</span></div>'+
      '<div><span>Próxima postagem</span><span>'+fmt(post)+'</span></div>'+
      '<div><span>Embalagem</span><span class="mono" id="pack"></span></div>'+
      '<div><span>Frete grátis</span><span>em compras a partir de R$ 79,00</span></div>';

    var spec = p.specs.map(function(r){return '<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>'}).join('');
    var bullets = p.bullets.map(function(b){return '<li>'+b+'</li>'}).join('');
    var descs = p.desc.map(function(d){return '<p>'+d+'</p>'}).join('');
    var pols = p.policies.map(function(x){return '<div class="pol"><b>'+x[0]+'</b><p>'+x[1]+'</p></div>'}).join('');

    app.innerHTML =
      '<a class="back" href="#inicio">← Todos os ovos</a>'+
      '<div class="layout"><div>'+
        '<div class="stage"><img id="mainImg" src="" alt=""><span class="cap" id="cap"></span></div>'+
        '<div class="thumbs" id="thumbs" role="group" aria-label="Fotos do produto"></div></div>'+
      '<div class="buy">'+
        '<p class="label">The Egg · Loja oficial</p>'+
        '<h1>'+p.title+'</h1>'+
        '<div class="meta"><span><strong>'+p.rating+'</strong> ★★★★★ ('+p.reviews+' avaliações)</span><span><strong>'+p.sold+'</strong> vendidos</span></div>'+
        '<div class="price"><span class="now mono" id="priceNow"></span><span class="old mono" id="priceOld"></span><span class="off" id="priceOff"></span><span class="inst" id="inst"></span></div>'+
        '<div class="field"><span class="label">'+p.variantLabel+'</span><div class="chips" id="chips" role="group" aria-label="'+p.variantLabel+'"></div></div>'+
        '<div class="field"><span class="label">'+p.qtyLabel+'</span><div class="qty"><div class="step">'+
          '<button type="button" id="minus" aria-label="Diminuir quantidade">−</button><output id="qty" aria-live="polite">1</output>'+
          '<button type="button" id="plus" aria-label="Aumentar quantidade">+</button></div><span class="stock" id="stock"></span></div></div>'+
        '<div class="hint" id="freeHint"></div>'+
        '<div class="cta"><button class="btn ghost" type="button" id="add">Adicionar ao carrinho</button><button class="btn solid" type="button" id="buyNow">Comprar agora</button></div>'+
        '<div class="status" id="status" role="status"></div>'+
      '</div></div>'+

      '<section class="block"><div class="sec-head"><h2>Envio</h2><p>Prazo contado em dias úteis a partir da postagem.</p></div>'+
        '<div class="ship-grid"><div><div class="origin">'+shipRows+'</div><div class="shipnote">'+p.shipNote+'</div></div>'+
        '<div><label class="label" for="cep">Calcule o frete para o seu CEP</label>'+
          '<form class="cep" id="cepForm" style="margin-top:8px" novalidate><input id="cep" inputmode="numeric" autocomplete="postal-code" maxlength="9" placeholder="00000-000"><button type="submit">Calcular</button></form>'+
          '<div class="err" id="cepErr" role="alert"></div><div class="opts" id="opts" role="radiogroup" aria-label="Opções de envio"></div></div></div></section>'+

      '<section class="block"><div class="sec-head"><h2>Como o pedido chega até você</h2><p>Você acompanha cada etapa pelo código de rastreio.</p></div>'+
        '<div class="code mono"><span class="label" style="letter-spacing:.06em">Código de exemplo</span> BR 5503 9921 47 SP</div>'+
        '<ol class="track" id="track"></ol><p class="note" id="trackNote"></p></section>'+

      '<section class="block"><div class="sec-head"><h2>Detalhes do produto</h2></div>'+
        '<div class="cols"><div class="desc">'+descs+'<ul>'+bullets+'</ul></div><div class="tablewrap"><table>'+spec+'</table></div></div>'+
        '<div class="policies">'+pols+'</div></section>';

    var maxQty = function(){ return Math.min(p.maxQ, p.variants[cur].stock); };

    function renderThumbs(){
      var th = $('thumbs'); th.innerHTML='';
      p.photos.forEach(function(f,i){
        var b = document.createElement('button');
        b.type='button'; b.className='thumb'; b.setAttribute('aria-pressed', i===photo);
        b.setAttribute('aria-label','Foto '+(i+1)+' de '+p.photos.length);
        b.innerHTML = '<img src="'+f.src+'" alt="">';
        b.onclick = function(){photo=i; showPhoto();};
        th.appendChild(b);
      });
    }
    function showPhoto(){
      var f = p.photos[photo];
      $('mainImg').src = f.src; $('mainImg').alt = f.alt; $('cap').textContent = f.cap;
      renderThumbs();
    }
    function renderChips(){
      var ch = $('chips'); ch.innerHTML='';
      p.variants.forEach(function(v,i){
        var c = document.createElement('button');
        c.type='button'; c.className='chip'; c.setAttribute('aria-pressed', i===cur);
        c.innerHTML = '<b>'+v.name+'</b><small>'+v.sub+'</small>';
        c.onclick = function(){cur=i; qty=Math.min(qty, maxQty()); renderBuy();};
        ch.appendChild(c);
      });
    }
    function renderBuy(){
      var v = p.variants[cur], sub = v.price*qty, off = Math.round((1 - v.price/v.old)*100);
      renderChips();
      $('priceNow').textContent = brl(v.price);
      $('priceOld').textContent = brl(v.old);
      $('priceOff').textContent = '-'+off+'%';
      $('inst').textContent = 'ou 2x de '+brl(v.price/2)+' sem juros';
      $('qty').textContent = qty;
      var s = v.stock;
      $('stock').textContent = s<=10 ? 'Restam só '+s+' '+(s===1?p.unit[0]:p.unit[1]) : s+' '+p.unit[1]+' disponíveis · máximo de '+p.maxQ+' por pedido';
      $('minus').disabled = qty<=1; $('plus').disabled = qty>=maxQty();
      $('pack').textContent = v.size+' · '+kgTxt(v.kg)+' cada';
      if(sub >= FREE_FROM){
        $('freeHint').textContent = 'Subtotal de '+brl(sub)+'. Esta compra tem frete grátis no envio padrão.';
      } else {
        var miss = FREE_FROM - sub, more = Math.ceil(miss / v.price);
        $('freeHint').textContent = 'Subtotal de '+brl(sub)+'. Faltam '+brl(miss)+' para o frete grátis, ou seja, mais '+more+' '+(more===1?p.unit[0]:p.unit[1])+'.';
      }
      renderShip();
    }

    // frete
    function range(a,b){ return fmt(addBiz(post,a))+' a '+fmt(addBiz(post,b)); }
    function buildOptions(){
      var r = p.regions[cepVal.charAt(0)];
      if(!r){ served=false; options=[]; return; }
      served = true;
      var v = p.variants[cur], free = v.price*qty >= FREE_FROM;
      var extra = Math.max(0, Math.ceil(v.kg*qty) - 2) * 2.5;
      options = [
        {name:'Padrão', info:range(r.std[0], r.std[1]), price: free ? 0 : Math.max(8.9, r.fee-5+extra), days:r.std[1]},
        {name:'Expresso', info:range(r.exp[0], r.exp[1]), price:r.fee+extra, days:r.exp[1]}
      ];
      if(chosen>=options.length) chosen = 0;
    }
    function renderShip(){
      buildOptions();
      var box = $('opts'); box.innerHTML='';
      if(!served){
        box.innerHTML = '<div class="nope"><b>Não entregamos neste CEP.</b> '+p.unserved+'</div>';
        renderTrack(); return;
      }
      options.forEach(function(o,i){
        var l = document.createElement('label'); l.className='opt';
        l.innerHTML = '<input type="radio" name="ship" '+(i===chosen?'checked':'')+'>'+
          '<span><b>'+o.name+'</b><small>Receba entre '+o.info+'</small></span>'+
          '<span class="p'+(o.price===0?' free':'')+' mono">'+(o.price===0?'Grátis':brl(o.price))+'</span>';
        l.querySelector('input').onchange = function(){chosen=i; renderTrack();};
        box.appendChild(l);
      });
      renderTrack();
    }
    function renderTrack(){
      var ol = $('track'); ol.innerHTML='';
      if(!served){ $('trackNote').textContent = 'Informe um CEP atendido para ver a previsão de entrega.'; return; }
      $('trackNote').textContent = 'As datas mostradas são uma previsão calculada para a opção de envio escolhida.';
      var total = options[chosen].days;
      var steps = [
        ['Pedido confirmado','Hoje',true],
        [p.trackStep, fmt(post), false],
        ['Coletado pela transportadora', fmt(post), false],
        ['Em trânsito', fmt(addBiz(post, Math.max(1, Math.round(total/2)))), false],
        ['Saiu para entrega', fmt(addBiz(post, total)), false],
        ['Entregue', fmt(addBiz(post, total)), false]
      ];
      steps.forEach(function(s){
        var li = document.createElement('li'); if(s[2]) li.className='done';
        li.innerHTML = '<b>'+s[0]+'</b><span>'+s[1]+'</span>';
        ol.appendChild(li);
      });
    }

    // eventos
    $('minus').onclick = function(){ if(qty>1){qty--; renderBuy();} };
    $('plus').onclick = function(){ if(qty<maxQty()){qty++; renderBuy();} };
    function say(m){ $('status').textContent = m; }
    $('add').onclick = function(){ var v=p.variants[cur]; say('Adicionado ao carrinho: '+qty+' × '+p.short+' ('+v.name+') por '+brl(v.price*qty)+'.'); };
    $('buyNow').onclick = function(){ say('Seguindo para o pagamento de '+brl(p.variants[cur].price*qty)+'.'); };

    var cepInput = $('cep');
    cepInput.value = cepVal.length>5 ? cepVal.slice(0,5)+'-'+cepVal.slice(5) : cepVal;
    cepInput.addEventListener('input', function(){
      var d = cepInput.value.replace(/\D/g,'').slice(0,8);
      cepInput.value = d.length>5 ? d.slice(0,5)+'-'+d.slice(5) : d;
    });
    $('cepForm').addEventListener('submit', function(e){
      e.preventDefault();
      var d = cepInput.value.replace(/\D/g,'');
      if(d.length!==8){ $('cepErr').textContent = 'Digite um CEP com 8 números, por exemplo 13010-000.'; return; }
      $('cepErr').textContent = '';
      cepVal = d; chosen = 0; renderShip();
    });

    showPhoto(); renderBuy();
  }

  // rotas por hash: #inicio ou #id-do-produto
  function route(){
    var id = (location.hash||'').replace('#','');
    var p = products.filter(function(x){return x.id===id})[0];
    if(p) renderProduct(p); else renderHome();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body></html>
